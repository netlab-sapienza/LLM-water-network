[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "waterbench"
version = "0.4.1"
description = "Simulation-based local LLM benchmark for water networks"
requires-python = ">=3.12,<3.14"
dependencies = ["wntr==1.5.0", "scikit-learn", "matplotlib"]

[project.scripts]
waterbench = "waterbench.cli:main"

[tool.setuptools.packages.find]
include = ["waterbench*"]
